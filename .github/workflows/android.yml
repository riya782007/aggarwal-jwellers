name: Android app

# Builds the Aggarwal Jewellers Android APK on GitHub's servers (full Android toolchain).
# - Every push to main that touches mobile/ → "live" APK as a build artifact.
# - Run manually (Actions → Android app → Run workflow) to choose live or a staging URL,
#   and to publish the APK as a GitHub Release that phones can download directly.
# The app loads the live website, so website changes NEVER need a new APK.

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Site the app opens (live by default; paste a Netlify Deploy Preview /admin URL for staging)"
        required: false
        default: "https://aggarwaljeweller.in/admin"
      publish_release:
        description: "Publish the APK as a GitHub Release (for installing on shop phones)"
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      CAP_SERVER_URL: ${{ inputs.server_url || 'https://aggarwaljeweller.in/admin' }}
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      - name: Sync web shell + plugins into the Android project
        run: npx cap sync android

      - name: Decode signing key (if configured)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aggarwal-jewellers.apk"
          else
            echo "::warning::No signing secrets set — building a debug APK. See mobile/README.md."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/aggarwal-jewellers.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: aggarwal-jewellers-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/aggarwal-jewellers.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Aggarwal Jewellers app 1.0.${{ github.run_number }}
          body: |
            Android app for the shop. Opens: ${{ env.CAP_SERVER_URL }}
            Install: open this page on the phone, tap aggarwal-jewellers.apk, allow "Install unknown apps" once.
          files: ${{ runner.temp }}/aggarwal-jewellers.apk
          make_latest: true
