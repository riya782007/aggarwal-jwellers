name: Android app

# Builds the Aggarwal Jewellers Android APK on GitHub's servers (full Android toolchain).
# - Every push to main that touches mobile/ → "live" APK as a build artifact.
# - Run manually (Actions → Android app → Run workflow) to choose live or a staging URL,
#   and to publish the APK as a GitHub Release that phones can download directly.
# The app loads the live website, so website changes NEVER need a new APK.

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Site the app opens (live by default; paste a Netlify Deploy Preview /admin URL for staging)"
        required: false
        default: "https://aggarwaljeweller.in/admin"
      publish_release:
        description: "Publish the APK as a GitHub Release (for installing on shop phones)"
        type: boolean
        default: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      # The app opens the LIVE console. A manual run with a different server_url (e.g. a Netlify
      # Deploy Preview) builds a separate "Aggarwal TEST" app that installs beside the live one.
      # (Pull requests use [skip netlify] to save credits, so there is no preview to point at.)
      CAP_SERVER_URL: ${{ inputs.server_url || 'https://aggarwaljeweller.in/admin' }}
      IS_TEST_APP: ${{ github.event_name == 'workflow_dispatch' && inputs.server_url != '' && inputs.server_url != 'https://aggarwaljeweller.in/admin' }}
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      # GitHub's Ubuntu runners ship the Android SDK (licences accepted); Gradle fetches any missing
      # platform itself. (android-actions/setup-android broke under the forced Node 24 runtime.)
      - name: Use the runner's Android SDK
        working-directory: mobile/android
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -d "$SDK" || { echo "::error::No Android SDK on this runner"; exit 1; }
          echo "sdk.dir=$SDK" > local.properties
          echo "Android SDK: $SDK"; ls "$SDK/platforms" || true

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      - name: Sync web shell + plugins into the Android project
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee "$RUNNER_TEMP/sync.log" || { tail -n 25 "$RUNNER_TEMP/sync.log" | sed 's/^/::error::/'; exit 1; }

      - name: Mark the TEST app (separate app, installs beside the live one)
        if: env.IS_TEST_APP == 'true'
        run: |
          sed -i 's|>Aggarwal Jewellers<|>Aggarwal TEST<|g' android/app/src/main/res/values/strings.xml
          sed -i 's|https://aggarwaljeweller.in/admin|'"$CAP_SERVER_URL"'|g' www/offline.html www/index.html android/app/src/main/assets/public/offline.html android/app/src/main/assets/public/index.html
          echo "APP_ID_SUFFIX=.test" >> "$GITHUB_ENV"
          echo "Test app → $CAP_SERVER_URL"

      - name: Decode signing key (if configured)
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { grep -E "error:|What went wrong|FAILURE|^e: |Could not" -A4 "$RUNNER_TEMP/gradle.log" | head -n 40 | sed 's/^/::error::/'; exit 1; }
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aggarwal-jewellers.apk"
          else
            echo "::warning::No signing secrets set — building a debug APK. See mobile/README.md."
            ./gradlew --no-daemon assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle.log" || { grep -E "error:|What went wrong|FAILURE|^e: |Could not" -A4 "$RUNNER_TEMP/gradle.log" | head -n 40 | sed 's/^/::error::/'; exit 1; }
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/aggarwal-jewellers.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IS_TEST_APP == 'true' && 'aggarwal-TEST' || 'aggarwal-jewellers' }}-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/aggarwal-jewellers.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Aggarwal Jewellers app 1.0.${{ github.run_number }}
          body: |
            Android app for the shop. Opens: ${{ env.CAP_SERVER_URL }}
            Install: open this page on the phone, tap aggarwal-jewellers.apk, allow "Install unknown apps" once.
          files: ${{ runner.temp }}/aggarwal-jewellers.apk
          make_latest: true
